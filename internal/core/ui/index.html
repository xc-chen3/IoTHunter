<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IoTHunter</title>
  <style>
    :root { color-scheme: dark; --bg:#0c1112; --sidebar:#111819; --surface:#182121; --surface2:#202b2b; --surface3:#263333; --line:#2d3a39; --text:#edf2ec; --muted:#91a19d; --dim:#647571; --accent:#d9f277; --accent-ink:#15200d; --blue:#8cc9ff; --warn:#f4c86e; --danger:#ff8d7c; }
    * { box-sizing:border-box; }
    html, body { height:100%; }
    body { margin:0; min-width:320px; overflow:hidden; background:var(--bg); color:var(--text); font:13px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    button,input,select,textarea { font:inherit; }
    button { border:0; cursor:pointer; }
    a { color:inherit; text-decoration:none; }
    .shell { display:grid; grid-template-columns:240px minmax(0,1fr); height:100vh; }
    .sidebar { display:flex; flex-direction:column; min-width:0; border-right:1px solid var(--line); background:var(--sidebar); }
    .brand { display:flex; align-items:center; gap:10px; height:64px; padding:0 20px; border-bottom:1px solid var(--line); font-size:16px; font-weight:800; letter-spacing:-.02em; }
    .logo { display:grid; place-items:center; width:28px; height:28px; border-radius:7px; background:var(--accent); color:var(--accent-ink); font-size:14px; font-weight:900; }
    .sidebar-scroll { overflow:auto; padding:18px 12px; }
    .nav-label { padding:12px 10px 7px; color:var(--dim); font-size:10px; font-weight:800; letter-spacing:.11em; text-transform:uppercase; }
    .nav { display:grid; gap:2px; }
    .nav a { display:flex; align-items:center; gap:10px; min-height:34px; padding:7px 10px; border-radius:6px; color:var(--muted); }
    .nav a:hover { background:var(--surface2); color:var(--text); }
    .nav a.active { background:var(--surface3); color:var(--text); box-shadow:inset 2px 0 0 var(--accent); }
    .nav-icon { width:18px; color:var(--dim); text-align:center; font-size:12px; }
    .nav a.active .nav-icon { color:var(--accent); }
    .sidebar-bottom { margin-top:auto; padding:14px 18px; border-top:1px solid var(--line); color:var(--muted); font-size:11px; }
    .status { display:flex; align-items:center; gap:7px; margin-bottom:4px; color:var(--text); }
    .dot { width:7px; height:7px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 4px rgba(217,242,119,.08); }
    .dot.offline { background:var(--danger); box-shadow:none; }
    .main { display:grid; grid-template-rows:64px minmax(0,1fr); min-width:0; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:18px; min-width:0; padding:0 24px; border-bottom:1px solid var(--line); background:#101718; }
    .breadcrumbs { display:flex; align-items:center; gap:9px; min-width:0; }
    .crumb-parent { color:var(--muted); }
    .crumb-sep { color:var(--dim); }
    .crumb-current { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:700; }
    .top-actions { display:flex; align-items:center; gap:9px; }
    .workspace-picker { max-width:210px; border:1px solid var(--line); border-radius:5px; padding:7px 9px; background:var(--surface); color:var(--text); }
    .content { overflow:auto; padding:26px clamp(20px,4vw,46px) 48px; }
    .page { max-width:1400px; margin:0 auto; }
    .page-head { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:23px; }
    .eyebrow { color:var(--muted); font-size:10px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
    h1,h2,h3,p { margin:0; }
    h1 { margin-top:5px; font-size:27px; letter-spacing:-.035em; line-height:1.1; }
    h2 { font-size:15px; letter-spacing:-.01em; }
    h3 { font-size:13px; }
    .lede { max-width:700px; margin-top:7px; color:var(--muted); }
    .actions { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:8px; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:32px; border:1px solid var(--line); border-radius:5px; padding:6px 11px; background:var(--surface2); color:var(--text); white-space:nowrap; }
    .btn:hover { background:var(--surface3); }
    .btn.primary { border-color:var(--accent); background:var(--accent); color:var(--accent-ink); font-weight:800; }
    .btn.primary:hover { background:#e6ff91; }
    .btn.small { min-height:27px; padding:4px 8px; font-size:12px; }
    .grid { display:grid; gap:14px; }
    .grid.cols-4 { grid-template-columns:repeat(4,minmax(0,1fr)); }
    .grid.cols-2 { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .split { display:grid; grid-template-columns:minmax(0,1.4fr) minmax(280px,.8fr); gap:16px; align-items:start; }
    .card { min-width:0; border:1px solid var(--line); background:var(--surface); }
    .card-head { display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:48px; padding:12px 15px; border-bottom:1px solid var(--line); }
    .card-head p { margin-top:2px; color:var(--muted); font-size:12px; }
    .card-body { padding:15px; }
    .metric { padding:16px; }
    .metric-value { margin-top:9px; font-size:27px; font-weight:800; letter-spacing:-.04em; }
    .metric-note { margin-top:2px; color:var(--muted); font-size:11px; }
    .table-wrap { overflow:auto; }
    table { width:100%; border-collapse:collapse; min-width:620px; }
    th,td { padding:10px 12px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; }
    th { color:var(--muted); font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    td { font-size:12px; }
    tbody tr:hover { background:rgba(255,255,255,.025); }
    .mono { color:var(--muted); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:10px; }
    .muted { color:var(--muted); }
    .empty { padding:34px 15px; color:var(--muted); text-align:center; }
    .pill { display:inline-flex; align-items:center; border:1px solid #40514d; border-radius:99px; padding:2px 7px; color:var(--accent); font-size:10px; white-space:nowrap; }
    .pill.warn { border-color:#6a5732; color:var(--warn); }
    .pill.danger { border-color:#68423c; color:var(--danger); }
    .pill.info { border-color:#345878; color:var(--blue); }
    .list { display:grid; }
    .list-row { display:flex; align-items:center; justify-content:space-between; gap:12px; min-width:0; padding:12px 15px; border-bottom:1px solid var(--line); }
    .list-row:last-child { border-bottom:0; }
    .list-main { min-width:0; }
    .list-main strong { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .list-main p { margin-top:2px; overflow:hidden; color:var(--muted); font-size:11px; text-overflow:ellipsis; white-space:nowrap; }
    .form { display:grid; gap:11px; }
    .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
    .field { display:grid; gap:5px; }
    .field.full { grid-column:1/-1; }
    label { color:var(--muted); font-size:11px; }
    input,select,textarea { width:100%; border:1px solid var(--line); border-radius:4px; outline:0; padding:8px 9px; background:#121a1a; color:var(--text); }
    textarea { min-height:80px; resize:vertical; }
    input:focus,select:focus,textarea:focus { border-color:var(--accent); }
    .form-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:3px; }
    .tabs { display:flex; gap:4px; overflow:auto; margin-bottom:15px; border-bottom:1px solid var(--line); }
    .toast { position:fixed; right:20px; bottom:20px; z-index:20; max-width:360px; transform:translateY(15px); opacity:0; pointer-events:none; border:1px solid var(--line); background:#25302f; padding:10px 13px; transition:.18s ease; }
    .toast.show { transform:translateY(0); opacity:1; }
    .toast.error { border-color:#75463f; color:#ffd5ce; }
    .loading { padding:30px; color:var(--muted); text-align:center; }
    @media (max-width:900px) { body { overflow:auto; } .shell { display:block; height:auto; min-height:100vh; } .sidebar { position:sticky; top:0; z-index:10; border-right:0; border-bottom:1px solid var(--line); } .sidebar-scroll { display:flex; gap:10px; overflow:auto; padding:8px 12px; } .nav-label { display:none; } .nav { display:flex; gap:2px; } .nav a { min-width:max-content; } .sidebar-bottom { display:none; } .main { display:block; } .topbar { position:sticky; top:0; z-index:9; } .content { overflow:visible; } .grid.cols-4 { grid-template-columns:repeat(2,minmax(0,1fr)); } .split { grid-template-columns:1fr; } }
    @media (max-width:600px) { .topbar { height:auto; min-height:58px; padding:10px 15px; } .workspace-picker { max-width:140px; } .content { padding:20px 14px 35px; } .page-head { display:grid; } .actions { justify-content:flex-start; } .grid.cols-4,.grid.cols-2,.form-grid { grid-template-columns:1fr; } .field.full { grid-column:auto; } h1 { font-size:24px; } }
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="#/overview"><span class="logo">I</span><span>IoTHunter</span></a>
      <div class="sidebar-scroll">
        <div class="nav-label">Workspace</div>
        <nav class="nav">
          <a href="#/overview" data-route="overview"><span class="nav-icon">[]</span>Overview</a>
          <a href="#/workspaces" data-route="workspaces"><span class="nav-icon">W</span>Workspaces</a>
          <a href="#/targets" data-route="targets"><span class="nav-icon">T</span>Targets</a>
          <a href="#/tasks" data-route="tasks"><span class="nav-icon">R</span>Tasks</a>
          <a href="#/findings" data-route="findings"><span class="nav-icon">!</span>Findings</a>
          <a href="#/evidence" data-route="evidence"><span class="nav-icon">E</span>Evidence</a>
        </nav>
        <div class="nav-label">Runtime</div>
        <nav class="nav">
          <a href="#/agents" data-route="agents"><span class="nav-icon">A</span>Agents</a>
          <a href="#/capabilities" data-route="capabilities"><span class="nav-icon">C</span>Capabilities</a>
          <a href="#/tools" data-route="tools"><span class="nav-icon">O</span>Tools</a>
          <a href="#/devices" data-route="devices"><span class="nav-icon">D</span>Devices</a>
        </nav>
        <div class="nav-label">Knowledge</div>
        <nav class="nav">
          <a href="#/skills" data-route="skills"><span class="nav-icon">S</span>Skills</a>
          <a href="#/knowledge" data-route="knowledge"><span class="nav-icon">K</span>Knowledge base</a>
        </nav>
        <div class="nav-label">Operations</div>
        <nav class="nav">
          <a href="#/approvals" data-route="approvals"><span class="nav-icon">Y</span>Approvals</a>
          <a href="#/events" data-route="events"><span class="nav-icon">L</span>Events</a>
          <a href="#/audit" data-route="audit"><span class="nav-icon">H</span>Audit log</a>
          <a href="#/settings" data-route="settings"><span class="nav-icon">*</span>Settings</a>
        </nav>
      </div>
      <div class="sidebar-bottom"><div class="status"><span id="status-dot" class="dot"></span><span id="connection">Connected</span></div><span class="mono">local control plane</span></div>
    </aside>
    <section class="main">
      <header class="topbar"><div class="breadcrumbs"><span class="crumb-parent">IoTHunter</span><span class="crumb-sep">/</span><strong id="crumb-current" class="crumb-current">Overview</strong></div><div class="top-actions"><select id="workspace-select" class="workspace-picker" aria-label="Select workspace"><option value="">No workspace selected</option></select><button id="refresh" class="btn" title="Refresh current page">Refresh</button></div></header>
      <main id="app-content" class="content"><div class="loading">Loading console...</div></main>
    </section>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script>
    const state = { workspaces: [], selected: null, detail: null, registry: {}, route: 'overview' };
    const $ = (id) => document.getElementById(id);
    const esc = (value) => String(value ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    const api = async (path, options = {}) => { const response = await fetch(path, { headers:{'Content-Type':'application/json'}, ...options }); const body = await response.json().catch(() => ({})); if (!response.ok) throw new Error(body.error || response.statusText); return body; };
    let toastTimer;
    const toast = (message, error = false) => { const el=$('toast'); el.textContent=message; el.className='toast show'+(error?' error':''); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.className='toast',3400); };
    const statusPill = (status) => { const danger=['failed','dropped','rejected','cancelled'].includes(status); const warn=['queued','running','blocked','validating','analyzing','pending'].includes(status); return '<span class="pill '+(danger?'danger':warn?'warn':'')+'">'+esc(status||'unknown')+'</span>'; };
    const fmtTime = (value) => value ? new Date(value).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '-';
    const currentWorkspace = () => state.workspaces.find((v)=>v.id===state.selected);
    const detail = () => state.detail || {};
    const card = (title, subtitle, body, action='') => '<section class="card"><div class="card-head"><div><h2>'+title+'</h2>'+(subtitle?'<p>'+subtitle+'</p>':'')+'</div>'+action+'</div>'+body+'</section>';
    const empty = (message) => '<div class="empty">'+message+'</div>';
    const page = (eyebrow,title,lede,body,actions='') => '<div class="page"><div class="page-head"><div><div class="eyebrow">'+eyebrow+'</div><h1>'+title+'</h1>'+(lede?'<p class="lede">'+lede+'</p>':'')+'</div><div class="actions">'+actions+'</div></div>'+body+'</div>';
    const table = (headers, rows, colspan) => '<div class="table-wrap"><table><thead><tr>'+headers.map((h)=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+(rows.length?rows.join(''): '<tr><td colspan="'+colspan+'">'+empty('Nothing to show yet.')+'</td></tr>')+'</tbody></table></div>';
    const loadWorkspaces = async () => { const result=await api('/api/v1/workspaces'); state.workspaces=result.workspaces||[]; if(!state.selected || !state.workspaces.some((w)=>w.id===state.selected)) state.selected=state.workspaces[0]?.id||null; renderWorkspaceSelect(); await loadDetail(); };
    const loadDetail = async () => { state.detail=state.selected ? await api('/api/v1/workspaces/'+encodeURIComponent(state.selected)) : null; };
    const loadRegistry = async () => { const [capabilities,tools,agents,skills,knowledge,events,audit,approvals]=await Promise.all([api('/api/v1/capabilities'),api('/api/v1/tools'),api('/api/v1/agents'),api('/api/v1/skills'),api('/api/v1/knowledge'),api('/api/v1/events'),api('/api/v1/audit'),api('/api/v1/approvals')]); state.registry={capabilities:capabilities.capabilities||[],tools:tools.tools||[],agents:agents.agents||[],skills:skills.skills||[],knowledge:knowledge.knowledge||[],events:events.events||[],audit:audit.audit||[],approvals:approvals.approvals||[]}; };
    const renderWorkspaceSelect = () => { $('workspace-select').innerHTML='<option value="">No workspace selected</option>'+state.workspaces.map((w)=>'<option value="'+esc(w.id)+'">'+esc(w.name)+'</option>').join(''); $('workspace-select').value=state.selected||''; };
    const workspacePicker = () => state.selected ? '<span class="pill info">'+esc(currentWorkspace()?.name||'Workspace')+'</span>' : '<span class="pill warn">Select workspace</span>';
    const renderOverview = () => { const d=detail(), targets=d.targets||[],tasks=d.tasks||[],findings=d.findings||[]; const metrics='<div class="grid cols-4"><div class="card metric"><div class="eyebrow">Workspaces</div><div class="metric-value">'+state.workspaces.length+'</div><div class="metric-note">research projects</div></div><div class="card metric"><div class="eyebrow">Targets</div><div class="metric-value">'+targets.length+'</div><div class="metric-note">in selected workspace</div></div><div class="card metric"><div class="eyebrow">Tasks</div><div class="metric-value">'+tasks.length+'</div><div class="metric-note">scheduled runs</div></div><div class="card metric"><div class="eyebrow">Findings</div><div class="metric-value">'+findings.length+'</div><div class="metric-note">tracked hypotheses</div></div></div>'; const recent=tasks.slice().reverse().slice(0,5).map((t)=>'<div class="list-row"><div class="list-main"><strong>'+esc(t.type)+'</strong><p>'+esc(t.objective||t.id)+'</p></div>'+statusPill(t.status)+'</div>'); const findRows=findings.slice().reverse().slice(0,5).map((f)=>'<div class="list-row"><div class="list-main"><strong>'+esc(f.title)+'</strong><p>'+esc(f.finding_id||f.id)+' · '+Math.round((f.confidence||0)*100)+'% confidence</p></div>'+statusPill(f.state)+'</div>'); const body=metrics+'<div class="split" style="margin-top:16px">'+card('Recent tasks','Latest execution state', '<div class="list">'+(recent.length?recent.join(''):empty('Select a workspace or submit a plan.'))+'</div>','<a class="btn small" href="#/tasks">View all</a>')+card('Findings','Review and gate research results','<div class="list">'+(findRows.length?findRows.join(''):empty('No findings in this workspace.'))+'</div>','<a class="btn small" href="#/findings">Open findings</a>')+'</div>'; return page('Control plane','Research overview','Coordinate targets, capabilities, evidence, and findings from one local console.',body,'<a class="btn primary" href="#/workspaces">New workspace</a>'); };
    const renderWorkspaces = () => { const rows=state.workspaces.map((w)=>'<tr><td><strong>'+esc(w.name)+'</strong><div class="mono">'+esc(w.id)+'</div></td><td>'+esc(w.owner||'local')+'</td><td>'+esc(w.description||'-')+'</td><td>'+fmtTime(w.created_at)+'</td><td><button class="btn small select-workspace" data-id="'+esc(w.id)+'">Open</button></td></tr>'); const body='<div class="split">'+card('Workspace registry','Projects and authorization boundaries',table(['Name','Owner','Description','Created',''],rows,5))+card('Create workspace','Start a new research project','<div class="card-body"><form id="workspace-form" class="form"><div class="field"><label>Name</label><input name="name" required placeholder="router-research"></div><div class="field"><label>Owner</label><input name="owner" value="local"></div><div class="field"><label>Description</label><textarea name="description" placeholder="Authorized lab project"></textarea></div><div class="form-actions"><button class="btn primary">Create workspace</button></div></form></div>')+'</div>'; return page('Workspace','Workspaces','Keep every target, task, finding, and approval inside an explicit research project.',body); };
    const renderTargets = () => { const d=detail(), targets=d.targets||[]; const rows=targets.map((t)=>'<tr><td><strong>'+esc(t.name)+'</strong><div class="mono">'+esc(t.id)+'</div></td><td>'+esc(t.vendor||'-')+' '+esc(t.model||'')+'</td><td>'+esc(t.address||'-')+'</td><td>'+esc(t.transport||'-')+'</td><td>'+(t.authorized?'<span class="pill">authorized</span>':'<span class="pill danger">unverified</span>')+'</td></tr>'); const body=card('Declared targets',state.selected?'Targets in '+esc(currentWorkspace()?.name):'Select a workspace first',table(['Name','Vendor / model','Address','Transport','Authorization'],rows,5)); const form=card('Add target','Declare scope before scheduling research','<div class="card-body"><form id="target-form" class="form"><div class="form-grid"><div class="field"><label>Name</label><input name="name" required placeholder="lab-router"></div><div class="field"><label>Vendor</label><input name="vendor" placeholder="ExampleVendor"></div><div class="field"><label>Model</label><input name="model" placeholder="Router X1"></div><div class="field"><label>Transport</label><input name="transport" placeholder="http"></div><div class="field full"><label>Address or identifier</label><input name="address" placeholder="192.0.2.10"></div></div><div class="form-actions"><button class="btn primary" '+(state.selected?'':'disabled')+'>Add target</button></div></form></div>'); return page('Research','Targets','Declare the assets that the control plane is allowed to inspect.',body+(state.selected?'<div style="margin-top:16px">'+form+'</div>':empty('Select a workspace from the top bar before adding a target.'))); };
    const renderTasks = () => { const tasks=(detail().tasks||[]).slice().reverse(); const rows=tasks.map((t)=>'<tr><td><strong>'+esc(t.type)+'</strong><div class="mono">'+esc(t.id)+'</div></td><td>'+statusPill(t.status)+'</td><td>'+esc(t.objective||'-')+'</td><td>'+fmtTime(t.created_at)+'</td><td><div class="actions"><button class="btn small task-action" data-action="'+(t.status==='paused'?'resume':'pause')+'" data-id="'+esc(t.id)+'">'+(t.status==='paused'?'Resume':'Pause')+'</button><button class="btn small task-action" data-action="cancel" data-id="'+esc(t.id)+'">Cancel</button></div></td></tr>'); const actions=state.selected?'<button id="run-plan" class="btn primary">Run passive plan</button>':'<span class="pill warn">Select workspace</span>'; return page('Research','Tasks','Track commander plans and capability runs for the selected workspace.',card('Task queue','Pause, resume, retry, or cancel scheduled work',table(['Task','Status','Objective','Created','Actions'],rows,5)),actions); };
    const renderFindings = () => { const findings=(detail().findings||[]).slice().reverse(); const rows=findings.map((f)=>'<tr><td><strong>'+esc(f.title)+'</strong><div class="mono">'+esc(f.finding_id||f.id)+'</div></td><td>'+statusPill(f.state)+'</td><td>'+esc(f.priority||'-')+'</td><td>'+Math.round((f.confidence||0)*100)+'%</td><td>'+esc(f.evidence_ids?.length||0)+'</td><td><button class="btn small gate-button" data-id="'+esc(f.finding_id||f.id)+'">Run gate</button></td></tr>'); return page('Research','Findings','Review hypotheses, apply the finding gate, and move validated results toward reporting.',card('Finding register',state.selected?'Findings in '+esc(currentWorkspace()?.name):'Select a workspace first',table(['Finding','State','Priority','Confidence','Evidence',''],rows,6))); };
    const renderEvidence = () => { const d=detail(), evidence=(d.evidence||[]).slice().reverse(), artifacts=d.artifacts||[]; const rows=evidence.map((e)=>'<tr><td><strong>'+esc(e.type||'evidence')+'</strong><div class="mono">'+esc(e.id)+'</div></td><td>'+esc(JSON.stringify(e.content||{}))+'</td><td>'+Math.round((e.confidence||0)*100)+'%</td><td>'+fmtTime(e.created_at)+'</td></tr>'); const artifactRows=artifacts.map((a)=>'<tr><td><strong>'+esc(a.name||'artifact')+'</strong></td><td>'+esc(a.path||'-')+'</td><td class="mono">'+esc((a.sha256||'').slice(0,16))+'</td></tr>'); return page('Research','Evidence','Traceable outputs collected by capability runs and attached to findings.',card('Evidence ledger','Structured evidence for the selected workspace',table(['Type','Content','Confidence','Created'],rows,4))+'<div style="margin-top:16px">'+card('Artifacts','Files and hashes produced during research',table(['Name','Path','SHA-256'],artifactRows,3))+'</div>'); };
    const registryPage = (eyebrow,title,lede,heading,subtitle,headers,rows) => page(eyebrow,title,lede,card(heading,subtitle,table(headers,rows,headers.length)));
    const renderCapabilities = () => { const list=state.registry.capabilities||[]; const rows=list.map((c)=>'<tr><td><strong>'+esc(c.id)+'</strong></td><td>'+esc(c.category||'-')+'</td><td>'+esc(c.description||'-')+'</td><td><button class="btn small capability-test" data-id="'+esc(c.id)+'">Test</button></td></tr>'); return registryPage('Runtime','Capabilities','Registered specialist functions available to the commander and agents.','Capability registry',list.length+' registered capabilities',['Capability','Category','Description',''],rows); };
    const renderTools = () => { const list=state.registry.tools||[]; const rows=list.map((t)=>'<tr><td><strong>'+esc(t.name)+'</strong></td><td>'+esc(t.category||'-')+'</td><td>'+esc(t.execution||'-')+'</td><td>'+esc(t.runtime||'-')+'</td></tr>'); return registryPage('Runtime','Tools','Execution implementations exposed to the control plane.','Tool registry',list.length+' registered tools',['Tool','Category','Execution','Runtime'],rows); };
    const renderAgents = () => { const list=state.registry.agents||[]; const rows=list.map((a)=>'<tr><td><strong>'+esc(a.role||a.id)+'</strong><div class="mono">'+esc(a.id)+'</div></td><td>'+esc(a.model_provider||'-')+'</td><td>'+esc(a.model||'-')+'</td><td>'+statusPill(a.status||(a.enabled?'enabled':'disabled'))+'</td><td>'+esc(a.max_concurrency||'-')+'</td></tr>'); return registryPage('Runtime','Agents','Commander and specialist agent lifecycle, models, and concurrency limits.','Agent pool','Configured execution identities',['Role','Provider','Model','Status','Concurrency'],rows); };
    const renderDevices = () => { const list=detail().devices||[]; const rows=list.map((d)=>'<tr><td><strong>'+esc((d.vendor?d.vendor+' ':'')+d.model)+'</strong><div class="mono">'+esc(d.id)+'</div></td><td>'+esc(d.serial||'-')+'</td><td>'+esc(d.transport||'-')+'</td><td>'+statusPill(d.status||'available')+'</td><td>'+(d.authorized?'<span class="pill">authorized</span>':'<span class="pill danger">unverified</span>')+'</td></tr>'); const form=state.selected?card('Declare device','Register a lab device or emulator','<div class="card-body"><form id="device-form" class="form"><div class="form-grid"><div class="field"><label>Vendor</label><input name="vendor" placeholder="ExampleVendor"></div><div class="field"><label>Model</label><input name="model" required placeholder="Router X1"></div><div class="field"><label>Serial</label><input name="serial" placeholder="lab-001"></div><div class="field"><label>Transport</label><input name="transport" placeholder="qemu / serial / lab"></div></div><div class="form-actions"><button class="btn primary">Declare device</button></div></form></div>'):''; return page('Runtime','Devices','Manage declared lab devices, emulators, and resource availability.',card('Device inventory',state.selected?'Devices in '+esc(currentWorkspace()?.name):'Select a workspace first',table(['Device','Serial','Transport','Status','Authorization'],rows,5))+(form?'<div style="margin-top:16px">'+form+'</div>':'')); };
    const renderSkills = () => { const list=state.registry.skills||[]; const rows=list.map((s)=>'<tr><td><strong>'+esc(s.name)+'</strong><div class="mono">'+esc(s.id)+'</div></td><td>'+esc(s.version||'-')+'</td><td>'+esc((s.steps||[]).join(' -> '))+'</td></tr>'); return registryPage('Knowledge','Skills','Reusable capability workflows that guide agent execution.','Skill catalog',list.length+' reusable workflows',['Skill','Version','Steps'],rows); };
    const renderKnowledge = () => { const list=(state.registry.knowledge||[]).slice().reverse(); const rows=list.map((k)=>'<tr><td><strong>'+esc(k.title)+'</strong><div class="mono">'+esc(k.id)+'</div></td><td>'+esc(k.kind)+'</td><td>'+esc(JSON.stringify(k.content||{}))+'</td><td>'+fmtTime(k.created_at)+'</td></tr>'); const form=card('Add knowledge','Store a reusable pattern or reference','<div class="card-body"><form id="knowledge-form" class="form"><div class="form-grid"><div class="field"><label>Kind</label><input name="kind" required placeholder="pattern"></div><div class="field"><label>Title</label><input name="title" required placeholder="HTTP banner pattern"></div><div class="field full"><label>Content (JSON)</label><textarea name="content" placeholder="{&quot;match&quot;:&quot;...&quot;}"></textarea></div></div><div class="form-actions"><button class="btn primary">Save knowledge</button></div></form></div>'); return page('Knowledge','Knowledge base','Capture reusable research context for future workspaces and agents.',card('Knowledge items','Shared research context',table(['Title','Kind','Content','Created'],rows,4))+'<div style="margin-top:16px">'+form+'</div>'); };
    const renderApprovals = () => { const list=(state.registry.approvals||[]).slice().reverse(); const rows=list.map((a)=>'<tr><td><strong>'+esc(a.capability_id||a.id)+'</strong><div class="mono">'+esc(a.id)+'</div></td><td>'+esc(a.reason||'-')+'</td><td>'+statusPill(a.status)+'</td><td>'+fmtTime(a.created_at)+'</td><td>'+(a.status==='pending'?'<button class="btn small approval-button" data-id="'+esc(a.id)+'">Approve</button>':'-')+'</td></tr>'); return registryPage('Operations','Approvals','Human decisions for capability requests that exceed the current permission boundary.','Approval queue','Review pending high-risk actions',['Request','Reason','Status','Created',''],rows); };
    const renderEvents = () => { const list=(state.registry.events||[]).slice().reverse(); const rows=list.slice(0,100).map((e)=>'<tr><td><strong>'+esc(e.type)+'</strong></td><td>'+esc(e.workspace_id||'-')+'</td><td>'+esc(e.task_id||e.finding_id||e.id)+'</td><td>'+fmtTime(e.created_at)+'</td></tr>'); return registryPage('Operations','Events','Control-plane execution history across workspaces and runtime components.','Event stream','Latest 100 events',['Event','Workspace','Resource','Time'],rows); };
    const renderAudit = () => { const list=(state.registry.audit||[]).slice().reverse(); const rows=list.slice(0,100).map((a)=>'<tr><td><strong>'+esc(a.action)+'</strong></td><td>'+esc(a.actor||'-')+'</td><td>'+esc(a.resource_type||'-')+'/'+esc(a.resource_id||'-')+'</td><td>'+fmtTime(a.created_at)+'</td></tr>'); return registryPage('Operations','Audit log','Append-only record of control-plane decisions and state changes.','Audit trail','Latest 100 entries',['Action','Actor','Resource','Time'],rows); };
    const renderSettings = () => page('System','Settings','Local console preferences and service information','<div class="grid cols-2">'+card('Connection','Current control-plane endpoint','<div class="card-body"><div class="list"><div class="list-row"><span class="muted">API endpoint</span><strong>'+esc(location.origin)+'</strong></div><div class="list-row"><span class="muted">Health</span><span id="settings-health">Checking...</span></div><div class="list-row"><span class="muted">Selected workspace</span>'+workspacePicker()+'</div></div></div>')+card('About IoTHunter','Research control plane','<div class="card-body"><p class="muted">A local, auditable workspace for coordinating IoT research tasks, capabilities, evidence, and findings.</p><p class="mono" style="margin-top:12px">Version 0.1.0</p></div>')+'</div>');
    const render = async () => { const route=(location.hash.replace(/^#\//,'')||'overview').split('/')[0]; state.route=route; document.querySelectorAll('[data-route]').forEach((el)=>el.classList.toggle('active',el.dataset.route===route)); $('crumb-current').textContent=route.charAt(0).toUpperCase()+route.slice(1); $('app-content').innerHTML='<div class="loading">Loading '+esc(route)+'...</div>'; try { await loadWorkspaces(); if(['capabilities','tools','agents','skills','knowledge','approvals','events','audit','overview'].includes(route)) await loadRegistry(); const views={overview:renderOverview,workspaces:renderWorkspaces,targets:renderTargets,tasks:renderTasks,findings:renderFindings,evidence:renderEvidence,capabilities:renderCapabilities,tools:renderTools,agents:renderAgents,devices:renderDevices,skills:renderSkills,knowledge:renderKnowledge,approvals:renderApprovals,events:renderEvents,audit:renderAudit,settings:renderSettings}; $('app-content').innerHTML=(views[route]||renderOverview)(); if(route==='settings') api('/healthz').then((h)=>$('settings-health').innerHTML='<span class="pill">'+esc(h.status)+'</span>').catch(()=>$('settings-health').innerHTML='<span class="pill danger">offline</span>'); } catch(error) { $('app-content').innerHTML=page('Error','Unable to load page',error.message,empty('Check the service and refresh the page.')); $('connection').textContent='Offline'; $('status-dot').classList.add('offline'); toast(error.message,true); } };
    const formData = (form) => Object.fromEntries(new FormData(form).entries());
    document.addEventListener('click', async (event) => { const ws=event.target.closest('.select-workspace'); if(ws){ state.selected=ws.dataset.id; renderWorkspaceSelect(); location.hash='#/overview'; return; } const gate=event.target.closest('.gate-button'); if(gate){ try{ const result=await api('/api/v1/findings/'+encodeURIComponent(gate.dataset.id)+'/gate',{method:'POST',body:JSON.stringify({gate:'finding'})}); toast('Finding gate: '+result.decision); await render(); }catch(e){toast(e.message,true);} return; } const approval=event.target.closest('.approval-button'); if(approval){ try{await api('/api/v1/approvals/'+encodeURIComponent(approval.dataset.id),{method:'POST',body:JSON.stringify({status:'approved',actor:'local-ui'})});toast('Approval granted');await render();}catch(e){toast(e.message,true);} return; } const task=event.target.closest('.task-action'); if(task){ try{await api('/api/v1/tasks/'+encodeURIComponent(task.dataset.id)+'/'+task.dataset.action,{method:'POST',body:'{}'});toast('Task updated');await render();}catch(e){toast(e.message,true);} return; } const test=event.target.closest('.capability-test'); if(test){ try{await api('/api/v1/capabilities/'+encodeURIComponent(test.dataset.id)+'/test',{method:'POST',body:JSON.stringify({objective:'Manual capability test',inputs:{}})});toast('Capability test submitted');await render();}catch(e){toast(e.message,true);} } });
    document.addEventListener('submit', async (event) => { event.preventDefault(); const form=event.target; try { if(form.id==='workspace-form'){ const value=formData(form); const workspace=await api('/api/v1/workspaces',{method:'POST',body:JSON.stringify(value)}); state.selected=workspace.id; toast('Workspace created'); await loadWorkspaces(); location.hash='#/overview'; } else if(form.id==='target-form'){ if(!state.selected) throw new Error('Select a workspace first'); const value=formData(form); value.authorized=true; await api('/api/v1/workspaces/'+state.selected+'/targets',{method:'POST',body:JSON.stringify(value)}); toast('Target added'); await loadDetail(); await render(); } else if(form.id==='device-form'){ if(!state.selected) throw new Error('Select a workspace first'); const value=formData(form); value.authorized=true; await api('/api/v1/workspaces/'+state.selected+'/devices',{method:'POST',body:JSON.stringify(value)}); toast('Device declared'); await loadDetail(); await render(); } else if(form.id==='knowledge-form'){ const value=formData(form); let content={}; if(value.content.trim()) content=JSON.parse(value.content); await api('/api/v1/knowledge',{method:'POST',body:JSON.stringify({kind:value.kind,title:value.title,content})}); toast('Knowledge saved'); await loadRegistry(); await render(); } } catch(error){toast(error.message,true);} });
    $('workspace-select').addEventListener('change', async (event)=>{ state.selected=event.target.value||null; try{await loadDetail();await render();}catch(e){toast(e.message,true);} });
    $('refresh').addEventListener('click', async ()=>{ try{await loadWorkspaces();await loadRegistry();await render();toast('Data refreshed');}catch(e){toast(e.message,true);} });
    document.addEventListener('click', async (event)=>{ if(event.target.id==='run-plan'){ if(!state.selected) return toast('Select a workspace first',true); const d=detail(); if(!d.targets?.length) return toast('Add a target before running research',true); try{await api('/api/v1/workspaces/'+state.selected+'/plan',{method:'POST',body:JSON.stringify({target_id:d.targets[0].id,objective:'Run passive reconnaissance and apply the finding gate',capabilities:['target.fingerprint']})});toast('Commander plan submitted');setTimeout(render,180);}catch(e){toast(e.message,true);} } });
    window.addEventListener('hashchange', render);
    (async()=>{try{await loadWorkspaces();await loadRegistry();await render();}catch(e){$('connection').textContent='Offline';$('status-dot').classList.add('offline');$('app-content').innerHTML=page('Error','IoTHunter is offline',e.message,empty('Start the local service and refresh this page.'));}})();
  </script>
</body>
</html>
