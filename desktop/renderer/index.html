<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IoTHunter</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="window">
    <aside class="sidebar">
      <div class="brand"><img src="../../logo2.png" alt="IoTHunter"><div class="brand-copy"><strong>IoTHunter</strong><small>AI-DRIVEN IOT VULNERABILITY RESEARCH</small></div></div>
      <div class="nav-scroll">
        <div class="nav-label" data-i18n="Workspace">工作台</div>
        <nav class="nav">
          <button data-page="overview"><span class="icon">&#9633;</span><span data-i18n="Chat and tasks">对话与任务</span></button>
          <button data-page="targets"><span class="icon">&#9670;</span><span data-i18n="Target management">目标管理</span></button>
          <button data-page="tasks"><span class="icon">&#9654;</span><span data-i18n="Task center">任务中心</span></button>
          <button data-page="devices"><span class="icon">&#9638;</span><span data-i18n="Device management">设备管理</span></button>
          <button data-page="files"><span class="icon">&#8776;</span><span data-i18n="Files and samples">文件与样本</span></button>
        </nav>
        <div class="nav-label" data-i18n="AI agents">AI 智能体</div>
        <nav class="nav">
          <button data-page="agents"><span class="icon">&#9673;</span><span data-i18n="Agent management">Agent 管理</span></button>
          <button data-page="capabilities"><span class="icon">&#10022;</span><span data-i18n="Capability center">能力中心</span></button>
          <button data-page="skills"><span class="icon">&#10024;</span><span data-i18n="Skill library">技能库 (Skills)</span></button>
          <button data-page="models"><span class="icon">&#9881;</span><span data-i18n="Model configuration">模型配置</span></button>
        </nav>
        <div class="nav-label" data-i18n="Peripheral management">外设管理</div>
        <nav class="nav">
          <button data-page="connections"><span class="icon">&#9737;</span><span data-i18n="Peripheral connections">外设连接</span></button>
          <button data-page="peripheral-config"><span class="icon">&#9881;</span><span data-i18n="Peripheral configuration">外设配置</span></button>
          <button data-page="protocols"><span class="icon">&#8776;</span><span data-i18n="Protocol analysis">协议分析</span></button>
        </nav>
        <div class="nav-label" data-i18n="Vulnerability management">漏洞管理</div>
        <nav class="nav">
          <button data-page="vulnerabilities"><span class="icon">&#9888;</span><span data-i18n="Vulnerability list">漏洞列表</span></button>
          <button data-page="vuln-knowledge"><span class="icon">&#9776;</span><span data-i18n="Vulnerability knowledge">漏洞知识库</span></button>
          <button data-page="risk"><span class="icon">&#10003;</span><span data-i18n="Risk assessment">风险评估</span></button>
        </nav>
        <div class="nav-label" data-i18n="Knowledge base">知识库</div>
        <nav class="nav">
          <button data-page="vendors"><span class="icon">&#9823;</span><span data-i18n="Vendor profiles">厂商画像</span></button>
          <button data-page="knowledge"><span class="icon">&#9776;</span><span data-i18n="Vulnerability knowledge">漏洞知识库</span></button>
          <button data-page="signatures"><span class="icon">&#8776;</span><span data-i18n="Protocol signatures">协议与特征</span></button>
        </nav>
        <div class="nav-label" data-i18n="System management">系统管理</div>
        <nav class="nav">
          <button data-page="runtime"><span class="icon">&#9678;</span><span data-i18n="Runtime">运行时</span></button>
          <button data-page="settings"><span class="icon">&#9881;</span><span data-i18n="Settings">设置</span></button>
        </nav>
      </div>
      <div class="sidebar-footer"><span class="online-dot"></span><span id="connection">Local control plane</span><span class="version">v0.2.0</span></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="window-controls"><button id="back" aria-label="Back">&#8249;</button><button id="forward" aria-label="Forward">&#8250;</button></div>
        <div class="search"><span>&#8981;</span><input id="global-search" data-i18n-placeholder="Search targets, tasks, findings, capabilities" placeholder="Search targets, tasks, findings, capabilities"><kbd>Ctrl K</kbd></div>
        <select id="workspace-select" class="workspace-picker"><option value="">Select workspace</option></select>
        <button id="language" class="top-action" title="Language">中 / EN</button><button id="settings" class="top-action" title="Settings">&#9881;</button><button id="refresh" class="refresh" title="Refresh">&#8635;</button>
      </header>
      <div class="workbench">
        <aside class="queue" id="queue"></aside>
        <section class="content" id="content"><div class="loading">Loading IoTHunter...</div></section>
        <aside class="inspector" id="inspector"></aside>
      </div>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <script src="./renderer.js"></script>
</body>
</html>
